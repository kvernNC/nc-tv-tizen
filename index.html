<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>NC TV</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <object id="av-player" type="application/avplayer"></object>
  <div id="radio" class="hidden">
    <div id="radio-logo-box"><img id="radio-logo" alt=""><div id="radio-letter"></div></div>
    <div id="radio-name"></div>
    <div id="radio-now">Radio en direct</div>
  </div>
  <div id="subs" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="osd" class="hidden">
    <div id="osd-channel"></div>
    <div id="osd-title"></div>
    <div id="osd-sub"></div>
    <div id="osd-hint">CH+/CH− ou ◀ ▶ : changer de chaîne · RETOUR : quitter</div>
  </div>
  <div id="mosaic" class="hidden">
    <div id="mosaic-head"><span id="mosaic-sel"></span><span id="mosaic-clock"></span></div>
    <div id="mosaic-view"><div id="mosaic-grid"></div></div>
    <div id="mosaic-hint">◀ ▶ ▲ ▼ : choisir · CH+/CH− : page · OK : regarder · RETOUR : fermer</div>
  </div>
  <div id="numbuf" class="hidden"></div>
  <div id="status" class="hidden"><div class="spinner"></div><span id="status-text"></span></div>
  <script src="js/channels.js"></script>
  <script src="js/taratata.js"></script>
  <script src="js/replay.js"></script>
  <script src="js/paratv.js"></script>
  <script src="js/epg.js"></script>
  <script src="js/mosaic.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
