# À chaque push sur main : si la version de config.xml (ex. 1.0.1) n'a pas encore de
# release, fabrique NC-TV.wgt et publie la release "v<version>".
# Pour publier une nouvelle version : changer version="..." dans config.xml et pousser.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: v
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('config.xml').getroot().get('version'))")
          test -n "$VERSION" -a "$VERSION" != "None"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION"

      - name: Vérifier si la release existe déjà
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "La release ${{ steps.v.outputs.tag }} existe déjà : rien à faire."
          fi

      - name: Fabriquer le .wgt
        if: steps.exists.outputs.skip != 'true'
        run: python3 tools/build_wgt.py

      - name: Java 17 (Android)
        if: steps.exists.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fabriquer l'APK Android TV
        if: steps.exists.outputs.skip != 'true'
        working-directory: android
        env:
          NCTV_KEYSTORE_B64: ${{ secrets.NCTV_KEYSTORE_B64 }}
          NCTV_KEYSTORE_PASSWORD: ${{ secrets.NCTV_KEYSTORE_PASSWORD }}
        run: |
          test -n "$NCTV_KEYSTORE_B64" || { echo "Secret NCTV_KEYSTORE_B64 manquant"; exit 1; }
          echo "$NCTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nctv.keystore"
          export NCTV_KEYSTORE="$RUNNER_TEMP/nctv.keystore"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/NC-TV-release.apk ../dist/NC-TV.apk

      - name: Publier la release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/NC-TV.wgt dist/NC-TV.apk \
            --target "$GITHUB_SHA" \
            --title "NC TV ${{ steps.v.outputs.tag }}" \
            --notes "**TV Samsung** : NC-TV.wgt, à installer avec Apps2Samsung. **Android TV / Google TV** : NC-TV.apk. Détails dans le README."
